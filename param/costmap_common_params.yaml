obstacle_range: 2.5 #"obstacle_range" 参数确定最大范围传感器读数，这将导致障碍物被放入代价地图中。在这里，我们把它设置在2.5米，这意味着机器人只会更新其地图包含距离移动基座2.5米以内的障碍物的信息。
raytrace_range: 3 #“raytrace_range”参数确定了用于清除指定范围外的空间。将其设置为3.0米，这意味着机器人将尝试清除3米外的空间，在代价地图中清除3米外的障碍物。
footprint: [[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]
# robot_radius: 0.43

inflation_radius: 0.3 #中心点保持距离障碍物1米远0.7
cost_scaling_factor: 2.5

plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: prohibition_layer,       type: "costmap_prohibition_layer_namespace::CostmapProhibitionLayer"}
    - {name: obstacles,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
 
obstacles:
    map_type: costmap
    observation_sources: scan
    # scan: {sensor_frame: laser_link, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
    scan: {sensor_frame: base_link_2d, data_type: LaserScan, topic: scan, marking: true, clearing: true}

prohibition_layer:
    enable: true
    fill_polygons: true

    # prohibition_areas:
    #   - [[0.9, 0.3], [0.9, 1.5], [1.2, 1.5], [1.2, 0.3]]